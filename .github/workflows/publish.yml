name: Publish programs feed
on:
  schedule:
    - cron: '17 */6 * * *'      # every 6 hours
  workflow_dispatch:            # "Run workflow" button for an instant refresh
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: publish-programs-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build programs.json from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/build.mjs
      - name: Commit if changed
        run: |
          git config user.name  "programs-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/programs.json docs/skipped.json docs/members.json docs/members-skipped.json docs/finder.json
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "chore: refresh programs feed"
          git pull --rebase origin main
          git push origin HEAD:main
